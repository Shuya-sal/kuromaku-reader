name: Build Kuromaku Reader APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show toolchain
        run: |
          java -version
          gradle --version | head -5
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Unit tests (feed pagination, parser, reader layout)
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuromaku-reader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Kuromaku Reader 2.1 (APK)
          body: |
            Reader Mode native untuk *Monogatari no Kuromaku* (Kaori Translation).

            * Versi: 2.1 (versionCode 21)
            * **BUG 1 diperbaiki**: seluruh halaman feed dibaca, Volume 1–7 lengkap (117 chapter).
              Sebelumnya crawl berhenti di halaman pendek sehingga hanya Volume 5–7 yang muncul.
            * **BUG 2 diperbaiki**: teks chapter panjang bisa digulir sampai paragraf terakhir,
              panel navigasi tidak lagi menutupi teks, window insets ditangani.
            * Tombol Muat ulang untuk memperbarui katalog.
            * Posisi baca per blok disimpan dan dipulihkan.
            * Tema terang / gelap / sepia, ukuran font, spasi baris, progres baca
            * Navigasi chapter sebelumnya / berikutnya / kembali ke perpustakaan

            APK debug, hasil build otomatis dari commit `${{ github.sha }}`.
            Aplikasi tidak memuat salinan novel; seluruh konten milik Kaori Translation.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
