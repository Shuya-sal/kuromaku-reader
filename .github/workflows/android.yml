name: Build Kuromaku Reader APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show toolchain
        run: |
          java -version
          gradle --version | head -5
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Unit tests (feed, parser, images, reader scroll, library page)
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuromaku-reader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Kuromaku Reader 2.3 (APK)
          body: |
            Reader Mode native untuk *Monogatari no Kuromaku* (Kaori Translation).
            
            * Versi: 2.3 (versionCode 23)
            * **Sistem gambar diperbaiki (akar masalah)**: sel ilustrasi lama berupa
              `ImageView` wrap_content tanpa isi, sehingga terukur **lebar 0** dan gambar
              tidak pernah tampil meski unduhan sukses. Kini tinggi kotak dipesan dari
              ukuran asli gambar (`data-original-width/height`), jadi gambar selalu punya
              kotak nyata dengan rasio asli dan lebar responsif.
            * Parser memilih `data-src` → `data-original` → `data-lazy-src` → `srcset` →
              `src`, dan **tidak berhenti** pada placeholder `data:`/`file:`.
            * Postingan "Illustrasi" diproses sebagai konten gambar, urutan asli dijaga:
              ilu_v1 5, v2 5, v3 5, v4 8, v5 7, v6 7, v7 7 gambar.
            * Gambar dapat diketuk untuk dibuka layar penuh, dengan cubit/zoom 1x–4x,
              geser, dan ketuk dua kali.
            * Bila gagal dimuat: pesan jelas + tahap kegagalan + tombol **Coba lagi**,
              dan tinggi kotak dipertahankan agar tidak ada ruang kosong besar.
            * Logging tahap gambar (`KuromakuImage`) dengan URL disamarkan (tanpa token).
            * Bookmark, scroll panjang 300 paragraf, dan navigasi chapter tetap berfungsi.
            * Tema terang / gelap / sepia, ukuran font, spasi baris, progres baca.
            * Semua volume tetap tampil, termasuk Volume 1–4 (117 chapter).

            APK debug, hasil build otomatis dari commit `${{ github.sha }}`.
            Aplikasi tidak memuat salinan novel; seluruh konten milik Kaori Translation.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
