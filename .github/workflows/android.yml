name: Build Kuromaku Reader APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show toolchain
        run: |
          java -version
          gradle --version | head -5
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Unit tests (feed, parser, images, reader scroll, library page, header & motion)
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee gradle-test.log

      - name: Name every failing test
        if: failure()
        run: |
          echo "## Why the tests step failed" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, re, os

          paths = sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"))
          cases = 0
          rows = []
          for path in paths:
              text = open(path, encoding="utf-8", errors="replace").read()
              for m in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"(.*?)(?:/>|</testcase>)',
                                   text, re.S):
                  cases += 1
                  if "<failure" in m.group(3) or "<error" in m.group(3):
                      message = re.search(r'message="([^"]{0,200})', m.group(3))
                      rows.append(f"- `{m.group(2)}.{m.group(1)}` — "
                                  f"{(message.group(1) if message else 'failed').replace('&quot;', chr(34))}")

          print(f"- berkas hasil tes: {len(paths)}, testcase tercatat: {cases}")

          # A failing step with no failing testcase is NOT "all tests passed".
          # It means the run stopped before the suite finished -- compilation,
          # a missing dependency, or the daemon dying. Saying "no failing test
          # was recorded" here once hid exactly that on run 46, whose test step
          # died after 30s against 60s on a passing run.
          if not paths:
              print("- **Tidak ada berkas hasil tes sama sekali**: build berhenti "
                    "sebelum suite berjalan (kompilasi/gradle), bukan tes yang gagal.")
          elif not rows:
              print("- **Tidak ada testcase gagal**, tetapi langkah tetap gagal: "
                    "kegagalannya di luar tes (lihat ekor log di bawah).")
          else:
              print("\n".join(rows))

          log = "gradle-test.log"
          if os.path.exists(log):
              tail = open(log, encoding="utf-8", errors="replace").read().splitlines()[-40:]
              print("\n<details><summary>ekor log gradle</summary>\n")
              print("```")
              print("\n".join(tail))
              print("```")
              print("</details>")
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          # The gradle log is included because run 46's test step failed with no
          # failing testcase recorded, and reading the log needs repo admin rights.
          # An artifact outlives that restriction and holds the actual reason.
          path: |
            app/build/reports/tests/testDebugUnitTest
            gradle-test.log
          if-no-files-found: ignore

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -5

      - name: Package source
        run: |
          set -e
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          OUT="kuromaku-reader-${VERSION}-source.zip"
          # Nama artefak dan judul rilis dibaca dari sini juga. Sebelumnya keduanya
          # ditulis tangan sebagai "2.20", sehingga build 2.20.1 akan tetap
          # menerbitkan APK berjudul 2.20 dengan nama artefak yang sama.
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          rm -f "$OUT"
          # This list is the contract with whoever builds from the zip. `zip` skips
          # a named path that does not exist and still exits 0, so a stale entry
          # here survives silently -- .gitignore was missing from the zip for
          # several releases and nothing ever failed, because the old list also
          # named app/proguard-rules.pro, a file this repo does not have.
          # Keep only paths that exist, and verify each one landed in the archive.
          # tools/ stays out on purpose: tools/icon_master.png alone is 2 MB, which
          # would grow the source zip from 1.4 MB to 3.3 MB for a dev-only asset.
          FILES="app/src app/build.gradle.kts build.gradle.kts settings.gradle.kts
                 gradle.properties .gitignore README.md .github"
          for f in $FILES; do
            if [ ! -e "$f" ]; then
              echo "::error::berkas sumber tidak ada: $f"
              exit 1
            fi
          done
          zip -qr "$OUT" $FILES -x "*/build/*"
          unzip -t "$OUT" > /dev/null
          for f in $FILES; do
            if ! unzip -l "$OUT" | grep -qE "[ /]$f(/|\$)"; then
              echo "::error::$f tidak masuk ke $OUT"
              exit 1
            fi
          done
          echo "sumber: $OUT ($(stat -c%s "$OUT") byte, $(unzip -l "$OUT" | grep -c '\.java$') berkas Java)"

      - name: Render release notes
        run: |
          set -e
          # `body_path` is read as a plain file: a GitHub expression left inside it
          # is published as that literal text, which is what shipped on 2.20. The
          # token is filled here instead, where the shell can see the real value.
          # Do not write an expression delimiter in this file, not even in a
          # comment: Actions interpolates it everywhere, and an invalid one makes
          # the whole workflow invalid -- run 38 failed with zero jobs because of
          # exactly that, one comment line.
          sed "s|@COMMIT@|${GITHUB_SHA}|g" .github/release-notes.md > release-body.md
          if grep -q "@COMMIT@" release-body.md; then
            echo "::error::token @COMMIT@ tidak terisi di release-body.md"
            exit 1
          fi
          if grep -q 'github.sha' release-body.md; then
            echo "::error::placeholder commit masih ada di badan rilis"
            exit 1
          fi
          # Checking only that the token disappeared is not enough: if the footer is
          # ever rewritten without it, nothing is substituted, the previous check
          # passes vacuously, and the release publishes with no commit named at all.
          # So the rendered body must actually contain this build's commit.
          if ! grep -q "${GITHUB_SHA}" release-body.md; then
            echo "::error::badan rilis tidak menyebut commit ${GITHUB_SHA}"
            exit 1
          fi
          echo "badan rilis: $(stat -c%s release-body.md) karakter, commit ${GITHUB_SHA}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuromaku-reader-${{ env.VERSION }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Kuromaku Reader ${{ env.VERSION }} (APK)
          body_path: release-body.md
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            kuromaku-reader-*-source.zip
          fail_on_unmatched_files: true
