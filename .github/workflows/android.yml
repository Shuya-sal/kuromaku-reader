name: Build Kuromaku Reader APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show toolchain
        run: |
          java -version
          gradle --version | head -5
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Unit tests (feed, parser, images, reader scroll, library page, header & motion)
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuromaku-reader-2.5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Kuromaku Reader 2.5 (APK)
          body: |
            Pembaca native untuk dua novel dari Kaori Translation:
            *Monogatari no Kuromaku* dan *Magical★Explorer*.

            * Versi: **2.5** (versionCode 25)
            * **Header ringkas di seluruh halaman**: toolbar satu baris 58 dp
              (56 dp di Reader Mode) di luar system inset, status bar inset
              diterapkan sebagai padding di atas toolbar sehingga judul tidak
              bertabrakan dengan jam/baterai. Judul selalu satu baris dan
              memakai ellipsize, jadi tidak pernah membungkus dan meninggikan
              toolbar.
            * Halaman detail memakai judul singkat **Detail Novel**; judul
              lengkap novel tetap di bagian konten bersama cover, metadata,
              sinopsis, dan daftar volume. Nama aplikasi hanya muncul sekali.
            * **Tombol Kembali** baru: rounded rectangle berikon panah kiri +
              teks "Kembali", 48 dp, lebar ≥ 92 dp, dengan ripple sesuai tema.
              Konsisten di detail novel, daftar chapter, Reader Mode, dan
              penampil ilustrasi. Tombol Back Android tetap bekerja.
            * **Muat ulang** dan **Gelap/Terang** menjadi ikon refresh dan
              bulan/matahari berukuran 48 dp dengan contentDescription.
            * **Animasi navigasi 180–250 ms**: fade-in + slide ringan dari kanan
              untuk maju, slide ke kanan + fade-out untuk kembali, accordion
              volume expand/collapse 200 ms, dan ripple pada kartu serta tombol.
              Semuanya menghormati pengaturan Android **Remove animations**.
            * **Novel kedua**: Magical★Explorer Eroge no Yuujin Kyara ni Tensei
              Shitakedo, Geemu Chishiki Tsukatte Jiyuu ni Ikiru.
            * **Cover berbeda untuk setiap volume** (rasio asli, tidak terpotong,
              tidak tertukar, dapat diketuk untuk diperbesar). Volume tanpa
              gambar memakai placeholder rapi.
            * **Parser katalog khusus Magical★Explorer**: halaman katalognya
              memuat volume + tautan chapter langsung, tanpa label Blogger.
              Ejaan sumber "Cahpter 2" dinormalkan dan tetap di posisi kedua.
              Teks tanpa tautan tidak pernah menjadi chapter.
            * **Progres baca, posisi gulir, dan accordion disimpan per novel**;
              Sebelumnya/Berikutnya tidak dapat menyeberang ke novel lain.
            * Reader Mode dipertahankan: kotak gambar berasio tetap, zoom 1x–4x,
              tombol Coba lagi, logging tanpa token.
            * Tema terang / gelap / sepia, ukuran font, spasi baris.
            * Monogatari no Kuromaku tetap lengkap: Volume 1–7, 117 chapter.
            * 135 unit test lulus, termasuk 18 tes header & animasi baru yang
              diukur di layar 320×640 dp dan 411×891 dp.

            APK debug, hasil build otomatis dari commit `${{ github.sha }}`.
            Aplikasi tidak memuat salinan novel; seluruh konten milik Kaori Translation.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
