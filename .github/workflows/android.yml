name: Build Kuromaku Reader APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show toolchain
        run: |
          java -version
          gradle --version | head -5
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Unit tests (feed, parser, images, reader scroll, library page, header & motion)
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Name every failing test
        if: failure()
        run: |
          echo "## Failing tests" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, re
          rows = []
          for path in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              text = open(path, encoding="utf-8", errors="replace").read()
              for m in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"(.*?)(?:/>|</testcase>)',
                                   text, re.S):
                  if "<failure" in m.group(3) or "<error" in m.group(3):
                      message = re.search(r'message="([^"]{0,200})', m.group(3))
                      rows.append(f"- `{m.group(2)}.{m.group(1)}` — "
                                  f"{(message.group(1) if message else 'failed').replace('&quot;', chr(34))}")
          print("\n".join(rows) if rows else "No failing test case was recorded.")
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -5

      - name: Package source
        run: |
          set -e
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          OUT="kuromaku-reader-${VERSION}-source.zip"
          rm -f "$OUT"
          zip -qr "$OUT" app/src app/build.gradle.kts app/proguard-rules.pro \
            build.gradle.kts settings.gradle.kts gradle.properties README.md .github \
            -x "*/build/*"
          unzip -t "$OUT" > /dev/null
          echo "sumber: $OUT ($(stat -c%s "$OUT") byte, $(unzip -l "$OUT" | grep -c '\.java$') berkas Java)"

      - name: Render release notes
        run: |
          set -e
          # `body_path` is read as a plain file: a GitHub expression left inside it
          # is published as that literal text, which is what shipped on 2.20. The
          # token is filled here instead, where the shell can see the real value.
          # Do not write an expression delimiter in this file, not even in a
          # comment: Actions interpolates it everywhere, and an invalid one makes
          # the whole workflow invalid -- run 38 failed with zero jobs because of
          # exactly that, one comment line.
          sed "s|@COMMIT@|${GITHUB_SHA}|g" .github/release-notes.md > release-body.md
          if grep -q "@COMMIT@" release-body.md; then
            echo "::error::token @COMMIT@ tidak terisi di release-body.md"
            exit 1
          fi
          if grep -q 'github.sha' release-body.md; then
            echo "::error::placeholder commit masih ada di badan rilis"
            exit 1
          fi
          echo "badan rilis: $(stat -c%s release-body.md) karakter, commit ${GITHUB_SHA}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuromaku-reader-2.20-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Kuromaku Reader 2.20 (APK)
          body_path: release-body.md
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            kuromaku-reader-*-source.zip
          fail_on_unmatched_files: true
