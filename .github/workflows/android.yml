name: Build Kuromaku Reader APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show toolchain
        run: |
          java -version
          gradle --version | head -5
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Unit tests (feed, parser, images, reader scroll, library page, header & motion)
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuromaku-reader-2.5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Kuromaku Reader 2.8 (APK)
          body: |
            Pembaca native untuk dua novel dari Kaori Translation:
            *Monogatari no Kuromaku* dan *Magical★Explorer*.

            * Versi: **2.8** (versionCode 28)
            * **Download offline**: chapter dan seluruh volume bisa diunduh dan
              dibaca tanpa internet, termasuk semua ilustrasi. Teks disimpan
              terstruktur (JSON dengan urutan blok dan posisi gambar) dan setiap
              ilustrasi disimpan sebagai file lokal di penyimpanan internal
              aplikasi — bukan sekadar URL.
            * **Status per chapter**: Belum diunduh, Mengunduh, Tersimpan, dan
              Gagal dengan tombol **Coba lagi**. Chapter yang sudah tersimpan
              langsung dibuka dari penyimpanan lokal tanpa menyentuh jaringan.
            * **Download Semua per volume** berjalan berurutan dengan progres
              "x dari y chapter", tombol **Batalkan**, dan chapter yang sudah
              lengkap dilewati sehingga tidak ada unduhan ulang atau duplikasi.
            * **WorkManager** untuk pekerjaan yang bertahan saat aplikasi
              ditutup, dibatasi 2 pekerja paralel agar tidak membebani sumber,
              retry dengan backoff eksponensial, notifikasi progres volume, dan
              tidak ada polling.
            * **Penulisan atomik**: setiap chapter ditulis ke berkas sementara
              lalu di-rename, jadi unduhan yang terputus tidak pernah dianggap
              selesai. Gambar dan konten divalidasi (HTTP 200, tipe gambar
              nyata, dimensi terbaca, minimal satu blok teks) sebelum chapter
              ditandai tersimpan.
            * **Identifier stabil** dari id novel + URL chapter, dengan namespace
              folder per novel sehingga data Monogatari dan Magical★Explorer
              tidak pernah tercampur. Berkas sementara dan gambar yatim
              dibersihkan agar tidak ada file tak terpakai.
            * **Halaman Unduhan**: daftar novel dan volume yang tersimpan,
              jumlah chapter, total penggunaan penyimpanan, tombol hapus
              chapter/volume dengan konfirmasi. Menghapus unduhan **tidak**
              menghapus progres membaca atau bookmark.
            * **Reader Mode offline**: memakai konten lokal bila ada, pesan jelas
              bila offline dan chapter belum diunduh, ilustrasi tetap tampil saat
              mode pesawat, posisi gambar di antara paragraf dipertahankan, dan
              Sebelumnya/Berikutnya tetap bekerja untuk chapter terunduh.
            * Pembaruan katalog dari Kaori Translation tetap berjalan: unduhan
              offline tidak menghalangi deteksi chapter baru, dan aplikasi tidak
              mengunduh ulang otomatis saat dibuka.
            * **Perbaikan bug halaman blank**: menekan ikon Unduhan dulu bisa
              meninggalkan toolbar hidup dengan seluruh isi di bawahnya hilang.
              Akarnya dua: (1) layar mengosongkan kontennya lebih dulu lalu baru
              membangun halaman, sehingga exception apa pun saat membangun —
              index unduhan rusak, status chapter yang gagal dibaca — menyisakan
              layar kosong tanpa pesan; (2) perubahan status unduhan dikirim
              langsung dari thread worker, jadi activity membangun ulang view di
              luar main thread dan berhenti setengah jalan. Sekarang halaman
              dibangun lengkap lebih dulu baru ditukar, kegagalan menampilkan
              pesan + tombol Coba lagi (bukan layar kosong), dan semua notifikasi
              status selalu dikirim di main thread.
            * **Halaman Unduhan selalu berisi**: keadaan kosong menampilkan ikon
              unduhan, "Belum ada chapter yang diunduh", keterangan "Pilih chapter
              atau volume untuk dibaca secara offline", dan tombol **Lihat
              Chapter**. Saat berjalan tampil judul novel + volume, "x dari y
              chapter selesai", progress bar, status chapter yang sedang diunduh,
              dan **Batalkan**. Saat gagal tampil alasannya dan **Coba Lagi**.
            * **Navigasi Unduhan benar**: header berjudul "Unduhan", tombol Kembali
              dan Back Android kembali ke **Detail Novel**, dan halaman detail
              kembali seperti semula — cover, metadata, sinopsis, daftar volume,
              serta posisi gulirnya tetap.
            * **Konfirmasi sebelum mengunduh banyak chapter**: "Download Semua"
              pada volume menyebut berapa chapter yang akan diunduh dan berapa
              yang sudah tersimpan sebelum mulai. Download chapter tunggal dan
              indikator status per chapter tetap seperti sebelumnya.
            * 207 unit test lulus (23 di antaranya khusus navigasi dan status
              halaman Unduhan), termasuk unduhan ulang tanpa duplikasi, resume
              setelah batal, penulisan atomik, data dua novel tidak tercampur,
              hapus unduhan tidak menghapus progres, pembacaan offline tanpa satu
              pun request, notifikasi status di main thread, dan layar tidak
              pernah kosong meski index unduhan rusak.
            * Seluruh fitur 2.6 dipertahankan: header dengan WindowInsets yang
              benar, tombol Kembali 48 dp, animasi 180–250 ms, dua novel,
              cover per volume, tema, ukuran font, dan posisi gulir.

            APK debug, hasil build otomatis dari commit `${{ github.sha }}`.
            Aplikasi tidak memuat salinan novel; seluruh konten milik Kaori Translation.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
